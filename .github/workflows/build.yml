name: Build Projects

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "version.txt"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/release.yml"
      - "release-please-config.json"
      - ".release-please-manifest.json"
      - "version.txt"
      - "CHANGELOG.md"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  check-backend-formatting:
    name: Check Code Formatting for Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run dotnet-format
        run: dotnet format GeoBingo.slnx --verify-no-changes
        working-directory: backend

  check-frontend-formatting:
    name: Check Code Formatting for Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun --bun install --dev
        working-directory: frontend

      - name: Run prettier lint
        run: bun --bun run lint
        working-directory: frontend

      - name: Run Svelte checks
        run: bun --bun run check
        working-directory: frontend

  build-backend-images:
    name: Build Backend Docker Images
    runs-on: ubuntu-latest
    needs: [check-backend-formatting]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: geobingo-api
            target: final
          - image: geobingo-migrations
            target: migrations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extracting metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=short

      - name: Read snapshot version
        id: version
        shell: bash
        run: |
          base_version="$(tr -d '[:space:]' < version.txt 2>/dev/null || true)"
          base_version="${base_version:-2.0.0}"
          short_sha="${GITHUB_SHA::7}"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "informational_version=$base_version+sha.$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/GeoBingo.Api/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.base_version }}
            APP_INFORMATIONAL_VERSION=${{ steps.version.outputs.informational_version }}

  build-frontend-image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [check-frontend-formatting]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extracting metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/geobingo-frontend
          tags: |
            type=sha,format=short

      - name: Read snapshot version
        id: version
        shell: bash
        run: |
          base_version="$(tr -d '[:space:]' < version.txt 2>/dev/null || true)"
          base_version="${base_version:-2.0.0}"
          short_sha="${GITHUB_SHA::7}"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "informational_version=v$base_version+sha.$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.base_version }}
            APP_INFORMATIONAL_VERSION=${{ steps.version.outputs.informational_version }}
