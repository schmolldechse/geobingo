name: geobingo

x-database-connection: &database-connection
  ConnectionStrings__DefaultConnection: >-
    Host=database;Port=5432;Database=${POSTGRES_DB:-geobingo};Username=${POSTGRES_USER:-geobingo};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

services:
  database:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geobingo}
      POSTGRES_USER: ${POSTGRES_USER:-geobingo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - database-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  migrations:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-schmolldechse}/geobingo-migrations:${IMAGE_TAG:-latest}
    restart: "no"
    exclude_from_hc: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *database-connection

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-schmolldechse}/geobingo-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      <<: *database-connection
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Authentication__Provider__Google__ClientId: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      Authentication__Provider__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      Authentication__AllowedOrigins__0: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
    expose:
      - "8080"
    volumes:
      - api-data-protection:/home/app/.aspnet/DataProtection-Keys

  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-schmolldechse}/geobingo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
      PUBLIC_GOOGLE_MAPS_API_KEY: ${PUBLIC_GOOGLE_MAPS_API_KEY:?PUBLIC_GOOGLE_MAPS_API_KEY is required}
    expose:
      - "3000"

volumes:
  database-data:
  api-data-protection:
